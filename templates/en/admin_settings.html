<div class="card admin max-w-md mx-auto">
  <h1 class="article-title text-xl mt-0 mb-2">settings</h1>
  {{err}}
  <form method="post" action="/admin/settings">
    <input type="hidden" name="csrf" value="{{csrf}}">
    <fieldset>
      <legend class="lgd">site</legend>
      <label class="lbl" for="f-title">site title</label>
      <input id="f-title" name="title" value="{{esite}}" maxlength="120" class="field w-full mb-2">
      <label class="lbl" for="f-ppp">posts per page</label>
      <small class="hint" id="h-ppp">1 to 50</small>
      <input id="f-ppp" name="ppp" value="{{eppp}}" type="number" inputmode="numeric" min="1" max="50" aria-describedby="h-ppp" class="field w-24 mb-2">
      <label class="lbl" for="f-banner">scrolling banner message</label>
      <input id="f-banner" name="banner" value="{{ebanner}}" maxlength="200" class="field w-full mb-2">
      <label class="lbl" for="f-url">site url</label>
      <small class="hint" id="h-url">for canonical links, the feed and the sitemap; blank = use the Host header</small>
      <input id="f-url" type="url" name="url" value="{{eurl}}" maxlength="255" placeholder="https://blog.example.com" aria-describedby="h-url" class="field w-full mb-2">
    </fieldset>
    <fieldset>
      <legend class="lgd">appearance</legend>
      <fieldset>
        <legend class="lbl">theme</legend>
        <label class="opt"><input type="radio" name="theme" value="retro" {{selretro}}> <span>Retro &mdash; 1990s web, polished</span></label>
        <label class="opt"><input type="radio" name="theme" value="sucre" {{selsucre}}> <span>Sucre &mdash; whitewashed colonial</span></label>
        <label class="opt"><input type="radio" name="theme" value="medellin" {{selmedellin}}> <span>Medell&iacute;n &mdash; flower-fair street poster</span></label>
        <label class="opt"><input type="radio" name="theme" value="bogota" {{selbogota}}> <span>Bogot&aacute; &mdash; brick and gold, editorial</span></label>
        <label class="opt"><input type="radio" name="theme" value="lapaz" {{sellapaz}}> <span>La Paz &mdash; neo-Andean cholet, dark</span></label>
        <label class="opt"><input type="radio" name="theme" value="cochabamba" {{selcochabamba}}> <span>Cochabamba &mdash; market chalkboards and kraft</span></label>
        <label class="opt"><input type="radio" name="theme" value="santacruz" {{selsantacruz}}> <span>Santa Cruz &mdash; tropical lowland, mission woodwork</span></label>
        <label class="opt"><input type="radio" name="theme" value="pittsburgh" {{selpittsburgh}}> <span>Pittsburgh &mdash; Steel City, black and gold</span></label>
      </fieldset>
      <fieldset>
        <legend class="lbl">language</legend>
        <label class="opt"><input type="radio" name="locale" value="en" {{selen}}> <span>English (US)</span></label>
        <label class="opt"><input type="radio" name="locale" value="es" {{seles}}> <span>Español (Bolivia)</span></label>
      </fieldset>
    </fieldset>
    <fieldset>
      <legend class="lgd">account</legend>
      <label class="lbl" for="f-pw">new password</label>
      <small class="hint" id="h-pw">at least 8 characters; blank = keep the current one</small>
      <input id="f-pw" type="password" name="password" autocomplete="new-password" aria-describedby="h-pw" class="field w-full mb-2">
      <label class="lbl" for="f-pw2">confirm new password</label>
      <input id="f-pw2" type="password" name="password2" autocomplete="new-password" class="field w-full mb-3">
    </fieldset>
    <div class="actions">
      <button class="btn btn-primary" type="submit">Save Settings</button>
      <a class="backlink text-sm" href="/admin">cancel</a>
    </div>
  </form>
</div>
