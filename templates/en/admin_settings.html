<div class="card max-w-md mx-auto">
  <h1 class="article-title text-xl mt-0 mb-2">settings</h1>
  <p class="error text-xs mb-2">{{err}}</p>
  <form method="post" action="/admin/settings">
    <input type="hidden" name="csrf" value="{{csrf}}">
    <label class="text-xs block">site title</label>
    <input name="title" value="{{esite}}" class="field w-full mb-2">
    <label class="text-xs block">posts per page (1-50)</label>
    <input name="ppp" value="{{eppp}}" class="field w-24 mb-2">
    <label class="text-xs block">scrolling banner message</label>
    <input name="banner" value="{{ebanner}}" maxlength="200" class="field w-full mb-2">
    <label class="text-xs block">site url (for canonical links, the feed and the sitemap; blank = use the Host header)</label>
    <input name="url" value="{{eurl}}" maxlength="255" placeholder="https://blog.example.com" class="field w-full mb-2">
    <fieldset class="mb-3">
      <legend class="text-xs mb-1">theme</legend>
      <label class="block text-sm mb-1"><input type="radio" name="theme" value="retro" {{selretro}}> Retro &mdash; 1990s web, polished</label>
      <label class="block text-sm mb-1"><input type="radio" name="theme" value="sucre" {{selsucre}}> Sucre &mdash; whitewashed colonial</label>
      <label class="block text-sm mb-1"><input type="radio" name="theme" value="medellin" {{selmedellin}}> Medell&iacute;n &mdash; flower-fair street poster</label>
      <label class="block text-sm mb-1"><input type="radio" name="theme" value="bogota" {{selbogota}}> Bogot&aacute; &mdash; brick and gold, editorial</label>
      <label class="block text-sm mb-1"><input type="radio" name="theme" value="lapaz" {{sellapaz}}> La Paz &mdash; neo-Andean cholet, dark</label>
      <label class="block text-sm mb-1"><input type="radio" name="theme" value="cochabamba" {{selcochabamba}}> Cochabamba &mdash; market chalkboards and kraft</label>
      <label class="block text-sm"><input type="radio" name="theme" value="santacruz" {{selsantacruz}}> Santa Cruz &mdash; tropical lowland, mission woodwork</label>
    </fieldset>
    <fieldset class="mb-3">
      <legend class="text-xs mb-1">language</legend>
      <label class="block text-sm mb-1"><input type="radio" name="locale" value="en" {{selen}}> English (US)</label>
      <label class="block text-sm"><input type="radio" name="locale" value="es" {{seles}}> Español (Bolivia)</label>
    </fieldset>
    <label class="text-xs block">new password (blank = keep current)</label>
    <input type="password" name="password" class="field w-full mb-2">
    <label class="text-xs block">confirm new password</label>
    <input type="password" name="password2" class="field w-full mb-3">
    <button class="btn" type="submit">Save Settings</button>
    <a class="backlink text-sm ml-3" href="/admin">cancel</a>
  </form>
</div>
