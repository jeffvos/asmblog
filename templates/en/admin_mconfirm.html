<div class="card admin max-w-md mx-auto">
  <h1 class="article-title text-xl mt-0 mb-2">delete this image?</h1>
  <p class="font-bold mb-3">{{etitle}}</p>
  <picture class="mpreview"><source type="image/webp" srcset="/media/{{id}}.webp"><img src="/media/{{id}}.png" alt="" loading="lazy" decoding="async"></picture>
  <p class="hint">Posts that embed it will show a broken image until you edit them.</p>
  <form method="post" action="/admin/media/delete">
    <input type="hidden" name="csrf" value="{{csrf}}">
    <input type="hidden" name="id" value="{{id}}">
    <div class="actions">
      <button class="btn btn-danger" type="submit">Yes, delete it</button>
      <a class="backlink text-sm" href="/admin/media">cancel</a>
    </div>
  </form>
</div>
