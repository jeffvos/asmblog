<div class="card admin max-w-md mx-auto">
  <h1 class="article-title text-xl mt-0 mb-2">delete this post?</h1>
  <p class="font-bold mb-3">{{etitle}}</p>
  <form method="post" action="/admin/delete">
    <input type="hidden" name="csrf" value="{{csrf}}">
    <input type="hidden" name="id" value="{{id}}">
    <div class="actions">
      <button class="btn btn-danger" type="submit">Yes, delete it</button>
      <a class="backlink text-sm" href="/admin">cancel</a>
    </div>
  </form>
</div>
