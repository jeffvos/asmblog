<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}} &mdash; {{site}}</title>
<link rel="stylesheet" href="/static/main.css?v={{cssv}}">
<link rel="alternate" type="application/atom+xml" href="/feed.xml" title="{{site}}">
<link rel="icon" href="/static/favicon.svg?v={{theme}}" type="image/svg+xml">
<link rel="icon" href="/favicon.ico?v={{theme}}" sizes="32x32">
<link rel="apple-touch-icon" href="/static/icon-192.png?v={{theme}}">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="{{themecolor}}">
{{meta}}</head>
<body class="min-h-screen {{theme}}">
<div class="mx-auto max-w-3xl px-3 py-6">
  <header class="masthead">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <a href="/" class="brand">{{site}}</a>
      <nav class="flex items-center gap-4 text-sm">
        <a class="navlink" href="/">home</a>
        <a class="navlink" href="/feed.xml">feed</a>
      </nav>
    </div>
  </header>
  <div class="banner" aria-hidden="true"><span>{{banner}}</span></div>
  <form action="/search" method="get" class="mb-5 flex gap-2">
    <input type="text" name="q" value="{{q}}" aria-label="search" placeholder="search the archives..." class="field flex-1 min-w-0">
    <button type="submit" class="btn">Search</button>
  </form>
  <main>
{{content}}
  </main>
  <footer class="footer mt-10 text-center text-xs">
    <div class="mb-3">you are visitor number <img class="hits" src="/hits.svg" alt="" width="56" height="18"></div>
    <div class="mb-3">
      <span class="badge badge-a">blogd 0.10</span>
      <span class="badge badge-b">100% ASM</span>
      <span class="badge badge-c">0 BYTES OF JS</span>
    </div>
    <div>best viewed with any browser &bull; <a class="navlink" href="/feed.xml">atom feed</a> &bull; est. 2026</div>
  </footer>
</div>
</body>
</html>
