{{html}}
<div class="card admin">
  <h1 class="article-title text-xl mt-0 mb-2">editor</h1>
  {{err}}
  <form method="post" action="/admin/save">
    <input type="hidden" name="csrf" value="{{csrf}}">
    <input type="hidden" name="id" value="{{id}}">
    <label class="lbl" for="f-title">title</label>
    <input id="f-title" name="title" value="{{etitle}}" maxlength="256" class="field w-full mb-2" autofocus>
    <label class="lbl" for="f-slug">slug</label>
    <small class="hint" id="h-slug">leave blank to derive it from the title</small>
    <input id="f-slug" name="slug" value="{{eslug}}" maxlength="128" aria-describedby="h-slug" class="field w-full mb-2">
    <label class="lbl" for="f-tags">tags</label>
    <small class="hint" id="h-tags">comma-separated: a-z, 0-9, dashes</small>
    <input id="f-tags" name="tags" value="{{etags}}" maxlength="256" aria-describedby="h-tags" class="field w-full mb-2">
    <label class="lbl" for="f-md">markdown</label>
    <small class="hint" id="h-md">insert an uploaded image with <code>![caption](/media/N)</code> — see <a class="backlink" href="/admin/media">media</a></small>
    <textarea id="f-md" name="md" rows="18" aria-describedby="h-md" class="field w-full mb-3 font-mono text-sm">{{emd}}</textarea>
    <div class="actions">
      <button class="btn btn-primary" type="submit" name="action" value="publish">Publish</button>
      <button class="btn" type="submit" name="action" value="draft">Save Draft</button>
      <button class="btn btn-quiet" type="submit" name="action" value="preview" formaction="/admin/preview">Preview</button>
      <a class="backlink text-sm" href="/admin">cancel</a>
    </div>
  </form>
</div>
