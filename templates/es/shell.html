<!doctype html>
<html lang="es-BO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}} &mdash; {{site}}</title>
<link rel="stylesheet" href="/static/main.css">
<link rel="alternate" type="application/atom+xml" href="/feed.xml" title="{{site}}">
</head>
<body class="min-h-screen {{theme}}">
<div class="mx-auto max-w-3xl px-3 py-6">
  <header class="masthead">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <a href="/" class="brand">{{site}}</a>
      <nav class="flex items-center gap-4 text-sm">
        <a class="navlink" href="/">inicio</a>
        <a class="navlink" href="/feed.xml">feed</a>
      </nav>
    </div>
  </header>
  <div class="banner" aria-hidden="true"><span>{{banner}}</span></div>
  <form action="/search" method="get" class="mb-5 flex gap-2">
    <input type="text" name="q" value="{{q}}" placeholder="buscar en el archivo..." class="field flex-1 min-w-0">
    <button type="submit" class="btn">Buscar</button>
  </form>
  <main>
{{content}}
  </main>
  <footer class="footer mt-10 text-center text-xs">
    <div class="mb-3">eres el visitante número <span class="hits">{{count}}</span> desde el arranque</div>
    <div class="mb-3">
      <span class="badge badge-a">blogd 0.6</span>
      <span class="badge badge-b">100% ASM</span>
      <span class="badge badge-c">0 BYTES DE JS</span>
    </div>
    <div>se ve mejor en cualquier navegador &bull; <a class="navlink" href="/feed.xml">feed atom</a> &bull; desde 2026</div>
  </footer>
</div>
</body>
</html>
