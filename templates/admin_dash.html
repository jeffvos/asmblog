<div class="bevel-out bg-[#c0c0c0] text-black px-4 py-3">
  <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
    <h1 class="text-xl font-bold text-[#000080] m-0">control panel</h1>
    <div class="flex flex-wrap items-center gap-2">
      <a class="btn95 no-underline text-black" href="/admin/new">+ New Post</a>
      <a class="btn95 no-underline text-black" href="/admin/settings">Settings</a>

        <input type="hidden" name="csrf" value="{{csrf}}">
        <button class="btn95" type="submit">Log out</button>
      </form>
    </div>
  </div>
  <table class="w-full text-sm border-collapse">

      <th class="pb-1">title</th><th class="pb-1">date</th><th class="pb-1">status</th><th></th>

{{rows}}
