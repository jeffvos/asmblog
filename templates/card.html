<article class="bevel-out bg-[#c0c0c0] text-black px-4 py-3 mb-4">
  <h2 class="text-lg font-bold m-0 leading-snug"><a href="{{url}}" class="postlink">{{title}}</a></h2>
  <div class="text-xs text-neutral-600 mt-1">{{date}} &nbsp;{{tags}}</div>
  <p class="text-sm mt-2 mb-0 text-neutral-800">{{excerpt}}&hellip;</p>
</article>
