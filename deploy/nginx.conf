# nginx reverse proxy for blogd. TLS terminates here; blogd listens on
# plain HTTP at 127.0.0.1:8080. Obtain certs with certbot, then:
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/blogd
#   sudo ln -s /etc/nginx/sites-available/blogd /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name blog.example.com;
    # ACME challenges pass through; everything else upgrades to HTTPS
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blog.example.com;

    # HTTP/3 (nginx >= 1.25 built with --with-http_v3_module): uncomment
    # and open UDP 443. Clients learn about it from Alt-Svc.
    # listen 443 quic reuseport;
    # listen [::]:443 quic reuseport;
    # add_header Alt-Svc 'h3=":443"; ma=86400' always;

    ssl_certificate     /etc/letsencrypt/live/blog.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # blogd serves its stylesheet pre-compressed with Content-Encoding set
    # (nginx never re-encodes those). The dynamic HTML, feed, sitemap and
    # manifest are compressed here.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/html text/plain application/atom+xml application/xml
               application/manifest+json image/svg+xml;

    # No caching overrides: blogd sets Cache-Control and ETags itself
    # (immutable for the versioned /static/main.css?v=..., a day for
    # icons, must-revalidate for pages) and answers 304s.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # blogd builds canonical/Open Graph/feed URLs from these two when
        # no site URL is configured in /admin/settings
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
