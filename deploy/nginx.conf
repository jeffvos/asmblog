# nginx reverse proxy for blogd. TLS terminates here; blogd listens on
# plain HTTP at 127.0.0.1:8080. Obtain certs with certbot, then:
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/blogd
#   sudo ln -s /etc/nginx/sites-available/blogd /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name blog.example.com;
    # ACME challenges pass through; everything else upgrades to HTTPS
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blog.example.com;

    ssl_certificate     /etc/letsencrypt/live/blog.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # blogd pre-compresses CSS and sets Content-Length; don't double-encode
    gzip off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        expires 7d;
        add_header Cache-Control "public";
    }
}
